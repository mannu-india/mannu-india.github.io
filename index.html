<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Becoming Zero</title>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;500;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">

<style>

/* RESET */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{

  font-family:'Manrope',sans-serif;

  background:
  radial-gradient(circle at top,#11212d,#050505 70%);

  color:#f2f2f2;

  overflow-x:hidden;
}

/* NAVBAR */

nav{

  position:fixed;

  top:0;

  width:100%;

  display:flex;

  justify-content:center;

  gap:25px;

  padding:18px;

  backdrop-filter:blur(14px);

  background:
  rgba(0,0,0,0.45);

  border-bottom:
  1px solid rgba(255,255,255,0.05);
}

nav a{

  color:#bfbfbf;

  text-decoration:none;

  transition:0.3s ease;
}

nav a:hover{

  color:#00ffd5;
}

/* HOME */

section{

  min-height:100vh;

  display:flex;

  flex-direction:column;

  justify-content:center;

  align-items:center;

  text-align:center;

  padding:120px 20px;
}

.title{

  font-family:'Playfair Display',serif;

  font-size:72px;

  background:
  linear-gradient(
  90deg,
  #00ffd5,
  #9f7aea
  );

  -webkit-background-clip:text;

  color:transparent;
}

.subtitle{

  margin-top:15px;

  color:#aaaaaa;

  font-size:18px;
}

/* PHOTO */

.profile{

  width:320px;

  max-width:90%;

  border-radius:20px;

  margin-top:40px;

  border:
  1px solid rgba(255,255,255,0.08);

  box-shadow:
  0 10px 35px rgba(0,0,0,0.25);
}

/* CARD */

.card{

  margin-top:35px;

  max-width:800px;

  background:
  rgba(255,255,255,0.05);

  border:
  1px solid rgba(255,255,255,0.05);

  padding:30px;

  border-radius:18px;

  line-height:1.9;
}

@media(max-width:768px){

  .title{

    font-size:48px;
  }

  .profile{

    width:170px;
    height:170px;
  }
}

</style>

</head>

<body>

<nav>

  <a href="#">Home</a>

  <a href="writing.html">Writing</a>

  <a href="#">Research</a>

  <a href="#">Contact</a>

</nav>

<section>

  <h1 class="title">
    Becoming Zero
  </h1>

  <p class="subtitle">
    Maths • Science • Writing • Thought
  </p>

  <img
    src="profile.jpg"
    alt="Profile Picture"
    class="profile"
  >

  <div class="card">

    <p>
      Hi! This is Akansha.
    </p>

    <br>

    <p>
      Student.
    </p>

    <br>

    <p>
      Learning through maths, science,
      writing and curiosity.
    </p>

  </div>

</section>

</body>

</html>
